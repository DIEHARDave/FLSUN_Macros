# FLSUN_Macros: bed meshes per bed temperature, and FLSun's bed levelling.
#
# PRINT_START loads the mesh for the print's bed temperature (a profile named
# like 60.0c), making it first if there isn't one. MESH_TEMP_SWEEP makes them
# all, from 55 to 110 C. BED_LEVEL_1 and BED_LEVEL_2 replace FLSun's: they keep
# the temperatures you set before running them.

[gcode_macro MESH_TEMP_SWEEP]
description: "Run MESH_IF_NEEDED BED_TEMP=... from 55°C to 110°C in 5°C steps"
gcode:
  RESPOND MSG="📏 Starting mesh temp sweep..."
  {% for temp in range(55, 115, 5) %}
    RESPOND MSG="➡️ MESH_IF_NEEDED BED_TEMP={temp}°C"
    MESH_IF_NEEDED BED_TEMP={temp}
  {% endfor %}
  M117 ✅ Sweep complete. Turning off heaters.
  RESPOND MSG="🔥 All mesh profiles generated. Turning off heaters."
  TURN_OFF_HEATERS
  G28
  SAVE_CONFIG

[gcode_macro _CREATE_MESH]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set PROFILE_NAME = BED_TEMP|string + 'c' %}
  {% set SOAK_TIME = params.SOAK_TIME|default(2)|float %}
  {% set EXTRUDER_WAITTEMP = 140 %}

  RESPOND MSG="🌡️ Preparing mesh for {PROFILE_NAME}..."
  M117 Homing
  {% if not 'xyz' in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  M104 S{EXTRUDER_WAITTEMP}
  M190 S{BED_TEMP}
  M109 S{EXTRUDER_WAITTEMP}

  RESPOND MSG="🛁 Soaking bed for {SOAK_TIME} minutes"
  M117 Soaking bed for mesh...
  WAIT_FOR WAIT_TIME={ 60 *  SOAK_TIME }

  RESPOND MSG="📐 Calibrating mesh for {PROFILE_NAME}"
  M117 Calibrating mesh...
  BED_MESH_CALIBRATE PROFILE={PROFILE_NAME}
  BED_MESH_PROFILE SAVE={PROFILE_NAME}
  RESPOND MSG="✅ Mesh saved: {PROFILE_NAME}"

[gcode_macro MESH_IF_NEEDED]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set PROFILE_NAME = BED_TEMP|string + 'c' %}
  {% set SOAK_TIME = params.SOAK_TIME|default(1)|float %}

  RESPOND MSG="🔍 Checking mesh profile: {PROFILE_NAME}"
  M117 🔍 Mesh Check: {PROFILE_NAME}

  {% if PROFILE_NAME in printer.bed_mesh.profiles %}
    RESPOND MSG="✅ Mesh exists: {PROFILE_NAME}. Loading..."
    M117 Mesh loaded: {PROFILE_NAME}
    BED_MESH_PROFILE LOAD={PROFILE_NAME}
  {% else %}
    RESPOND MSG="❌ Mesh not found. Creating {PROFILE_NAME}..."
    M117 Creating new mesh: {PROFILE_NAME}
    _CREATE_MESH BED_TEMP={BED_TEMP} SOAK_TIME={SOAK_TIME}
  {% endif %}

[gcode_macro ADAPTIVE_MESH]
description: Probe a mesh just around the print's objects (PRINT_START runs it when adaptive_mesh is 1)
gcode:
  # Upstream Klipper (FLSUN_klipper) shrinks the probed circle to fit the
  # objects the slicer declared with EXCLUDE_OBJECT_DEFINE (Orca: Exclude
  # objects). The mesh isn't saved as a profile, so the per-temperature
  # meshes stay as they are. Without either, the saved mesh is used instead.
  {% set bed_temp = params.BED_TEMP|default(printer.heater_bed.target)|float %}
  {% set defaults = printer['gcode_macro _START_PRINT_VARS'] %}
  {% set saved = printer.save_variables.variables.start_print_vars|default({}) %}
  {% set margin = params.MARGIN|default(saved.adaptive_margin if 'adaptive_margin' in saved else defaults.adaptive_margin)|float %}
  {% set objects = printer.exclude_object.objects if 'exclude_object' in printer else [] %}
  {% if 'adaptive_margin' not in printer.configfile.settings.bed_mesh|default({}) %}
    RESPOND MSG="Adaptive mesh needs upstream Klipper (FLSUN_klipper); using the saved mesh"
    MESH_IF_NEEDED BED_TEMP={bed_temp}
  {% elif not objects %}
    RESPOND MSG="No objects in this file (turn on Exclude objects in Orca); using the saved mesh"
    MESH_IF_NEEDED BED_TEMP={bed_temp}
  {% else %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    # Probe with the nozzle at 140 °C, as _CREATE_MESH and FLSun's levelling do.
    {% if printer.extruder.target < 140 %}
      M109 S140
    {% endif %}
    RESPOND MSG="📐 Adaptive mesh around {objects|length} object(s), {margin} mm margin"
    M117 Adaptive mesh...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
  {% endif %}

[gcode_macro BED_LEVEL_1] # Thanks https://www.reddit.com/user/tuxlinux/
rename_existing: BED_LEVEL_1_OLD
gcode:
  {% set nozzle_temp = printer.extruder.target|float %}
  {% set bed_temp = printer.heater_bed.target|float %}

  # Save current temps to persistent storage
  SAVE_VARIABLE VARIABLE=nozzle_temp VALUE={nozzle_temp}
  SAVE_VARIABLE VARIABLE=bed_temp VALUE={bed_temp}

  # Show temperatures on screen
  M117 🔧 Nozzle Temp: {nozzle_temp|round(1)}°C
  M117 🔧 Bed Temp: {bed_temp|round(1)}°C

  SET_GCODE_OFFSET Z=0
  M117 🛠️ BED LEVEL 1 START
  G28
  M204 S200
  M104 S140
  M140 S60
  M109 S140
  M190 S60
  delta_calibrate
  G1 X0 Y0 Z50 F4200
  M104 S0
  M140 S0
  G28

  SAVE_VARIABLE VARIABLE=level_state VALUE=True

[gcode_macro BED_LEVEL_2]
rename_existing: BED_LEVEL_2_OLD
gcode:
  M117 🛠️ BED LEVEL 2 START
  G28

  # Restore stored temps
  {% set svv = printer.save_variables.variables %}
  {% set nozzle_temp = svv.nozzle_temp|float %}
  {% set bed_temp = svv.bed_temp|float %}

  M117 ♻️ Restoring Nozzle Temp: {nozzle_temp|round(1)}°C
  M117 ♻️ Restoring Bed Temp: {bed_temp|round(1)}°C

  M104 S{nozzle_temp}
  M140 S{bed_temp}
  M109 S{nozzle_temp}
  M190 S{bed_temp}

  M117 🔄 Calibrating Mesh
  G1 X0 Y0 Z50 F4200
  bed_mesh_calibrate
  G1 X0 Y0 Z50 F4200
  G28

  SAVE_VARIABLE VARIABLE=level2_state VALUE=True
