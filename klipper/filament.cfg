# FLSUN_Macros: filament loading and unloading. LOAD_FILAMENT heats to 240 C if
# the nozzle is colder than 235 C; heat it yourself first for other materials.

[gcode_macro UNLOAD_FILAMENT]
gcode:
  RESPOND MSG="♻️ Unloading filament..."
  M117 Heating complete. Unloading...
  G91
  G1 E-100 F200
  G90
  M117 ✅ Filament unloaded
  RESPOND MSG="✅ Filament unload complete"

[gcode_macro LOAD_FILAMENT]
gcode:
  {% if printer.extruder.temperature < 235 %}
    RESPOND MSG="🔥 Heating extruder to 240°C"
    M109 S240
  {% endif %}
  RESPOND MSG="🧵 Loading filament..."
  M117 Heating complete. Loading filament...
  G91
  G1 E100 F800
  G1 E100 F800
  G1 E30 F300
  G90
  RESPOND MSG="✅ Filament loaded"
  M117 ✅ Filament load complete
  
