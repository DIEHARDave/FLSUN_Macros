# FLSUN_Macros: PRINT_START and PRINT_END for the FLSun T1 Pro, with a heat soak
# and a Z offset per material, a per-temperature bed mesh and a prime line.
#
# Orca's Machine start G-code:
#   PRINT_START BED={bed_temperature_initial_layer_single} EXTRUDER={nozzle_temperature_initial_layer[0]} MATERIAL={filament_type[0]}
# Machine end G-code:
#   PRINT_END
#
# The settings in _START_PRINT_VARS are defaults. Change one with
# SET_START_PRINT_VAR NAME=<name> VALUE=<n> (saved in savedVariables1.cfg, so it
# survives restarts); SHOW_START_PRINT_VARS lists them, VALUE=DEFAULT resets one.

[gcode_macro _START_PRINT_VARS]
######################################################################
# Defaults. Change a setting with SET_START_PRINT_VAR NAME=<name> VALUE=<n>;
# it's saved in savedVariables1.cfg (start_print_vars) and survives
# restarts. SHOW_START_PRINT_VARS lists them, VALUE=DEFAULT goes back.
######################################################################
variable_wait_pla: 1
variable_wait_petg: 2
variable_wait_asa: 5
variable_wait_abs: 5
variable_wait_default: 3

variable_offset_PLA: 0
variable_offset_PETG: 0
variable_offset_ABS: 0
variable_offset_ASA: 0
variable_offset_DEFAULT: 0
variable_offset_PROBE: 0
variable_heat_soak: 5 # minutes
gcode:

[gcode_macro SET_START_PRINT_VAR]
description: Save a PRINT_START setting, e.g. NAME=offset_pla VALUE=0.02 (VALUE=DEFAULT resets it)
gcode:
  {% set name = params.NAME|default('')|lower %}
  {% set defaults = printer['gcode_macro _START_PRINT_VARS'] %}
  {% if name not in defaults %}
    {action_raise_error("NAME must be one of: %s" % (defaults|list|sort|join(', ')))}
  {% endif %}
  {% set saved = printer.save_variables.variables.start_print_vars|default({}) %}
  {% set new = {} %}
  {% for k in saved if k != name %}
    {% set _ = new.update({k: saved[k]}) %}
  {% endfor %}
  {% if params.VALUE is not defined %}
    {action_raise_error("VALUE is missing (a number, or DEFAULT)")}
  {% elif params.VALUE|upper == 'DEFAULT' %}
    RESPOND MSG="{name} reset to its default: {defaults[name]}"
  {% else %}
    {% set _ = new.update({name: params.VALUE|float}) %}
    RESPOND MSG="{name} = {params.VALUE|float} (default {defaults[name]})"
  {% endif %}
  SAVE_VARIABLE VARIABLE=start_print_vars VALUE="{new}"

[gcode_macro SHOW_START_PRINT_VARS]
description: List the PRINT_START settings, saved or default
gcode:
  {% set defaults = printer['gcode_macro _START_PRINT_VARS'] %}
  {% set saved = printer.save_variables.variables.start_print_vars|default({}) %}
  {% set lines = [] %}
  {% for k in defaults|list|sort %}
    {% set _ = lines.append("%s = %s%s" % (k, saved[k] if k in saved else defaults[k], " (saved)" if k in saved else "")) %}
  {% endfor %}
  {action_respond_info("PRINT_START settings:\n" ~ lines|join("\n"))}

[gcode_macro MATERIAL_WAIT]
description: Waits a material-specific amount of time to heat soak the bed using _START_PRINT_VARS
gcode:
    {% set mat = params.MATERIAL|default("PLA")|upper %}
    {% set defaults = printer['gcode_macro _START_PRINT_VARS'] %}
    {% set saved = printer.save_variables.variables.start_print_vars|default({}) %}
    {% set key = 'wait_' ~ (mat|lower if mat in ['PLA', 'PETG', 'ASA', 'ABS'] else 'default') %}
    {% set soak_time = saved[key] if key in saved else defaults[key] %}

    RESPOND MSG="Heat soaking for {soak_time}m ({mat})"
    WAIT_FOR WAIT_TIME={soak_time * 60}
    M117 Heat soak complete
    

[gcode_macro SET_MATERIAL_OFFSET]
gcode:
  {% set MATERIAL = params.MATERIAL|default('')|string %}

  {% set defaults = printer['gcode_macro _START_PRINT_VARS'] %}
  {% set saved = printer.save_variables.variables.start_print_vars|default({}) %}
  {% set probe = saved['offset_probe'] if 'offset_probe' in saved else defaults.offset_probe %}
  SET_GCODE_OFFSET Z=0
  {% if probe == 1 %}
    RESPOND MSG="Not adjusting Z offset relying on probe ..."
  {% else %}
    {% set key = 'offset_' ~ (MATERIAL|lower if MATERIAL|upper in ['PLA', 'PETG', 'ASA', 'ABS'] else 'default') %}
    {% set OFFSET = saved[key] if key in saved else defaults[key] %}

    RESPOND MSG="Setting Z offset for {MATERIAL} of {OFFSET} ..."
    SET_GCODE_OFFSET Z={OFFSET}
  {% endif %}

[gcode_macro WAIT_FOR]
description: "Wait for a specified number of seconds with logging every 30s"
variable_WAIT_TIME: 300
gcode:
  {% set wait_time = params.WAIT_TIME|default(300)|int %}
  {% set interval = 30 %}
  {% set loops = wait_time // interval %}
  {% set remainder = wait_time % interval %}

  RESPOND MSG="⏳ Waiting {wait_time}s total..."

  {% for i in range(loops) %}
    {% set remaining_time = wait_time - (i * interval) %}
    {% set minutes = remaining_time // 60 %}
    {% set seconds = remaining_time % 60 %}
    RESPOND MSG="⏳ {minutes}m {seconds}s remaining..."
    G4 P{interval * 1000}
  {% endfor %}

  {% if remainder > 0 %}
    RESPOND MSG="⏳ 0m {remainder}s remaining..."
    G4 P{remainder * 1000}
  {% endif %}

  RESPOND MSG="✅ Wait complete"

[gcode_macro PRIME_LINE]
gcode:
  RESPOND MSG="🧵 Drawing prime line"
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  G1 Z150 F3000
  G1 X-130 Y0 Z0.4
  M107 T0
  G92 E0
  G3 X0 Y-130 I130 J0 Z0.3 E30 F2000
  G1 Z2 F2000
  G92 E0

[gcode_macro SHORT_PRIME_LINE]  #Thanks to https://www.reddit.com/user/TheDepep1/
gcode:
  RESPOND MSG="🧵 Drawing prime line"
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  G1 Z150 F3000
  G1 X-130 Y0 Z0.4
  M107 T0
  G92 E0
  G3 X-92 Y-92 I130 J0 Z0.3 E45 F2000
  G1 Z2 F2000
  G92 E0

[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set profile_name = target_bed|string + 'c' %}
  {% set material = params.MATERIAL|default("") %}

  SET_MATERIAL_OFFSET MATERIAL={material}

  RESPOND MSG="🚀 Starting print prep"
  CLEAR_PAUSE
  G21
  M82
  G90
  G28
  M117 🔥 Heating bed to {target_bed}°C
  M190 S{target_bed}

  MATERIAL_WAIT MATERIAL={material}

  RESPOND MSG="📐 Checking mesh profile: {profile_name}"
  MESH_IF_NEEDED BED_TEMP={target_bed}

  RESPOND MSG="🔥 Heating nozzle to {target_extruder}°C"
  M104 S{target_extruder}
  M109 S{target_extruder}

  M117 🧵 Priming line...
  SHORT_PRIME_LINE

  RESPOND MSG="🔌 Print ready"
  SET_TMC_CURRENT STEPPER=extruder CURRENT=0.8

[gcode_macro PRINT_END]
gcode:
  RESPOND MSG="🧼 Print ending. Cooling down."
  G91
  G1 E-15 F3600 #Retracf From the Nozzle
  G1 E-15 F800  #Retract from the meltzone
  G90
  M107 T0
  M104 S0
  M140 S0
  G92 E0
  # Lift off the print first; a move before homing would stop the macro here.
  {% if 'xyz' in printer.toolhead.homed_axes %}
    G91
    G1 Z+0.5 F6000
    G90
  {% endif %}
  G28
  G90
  # FLSun's end of print: extruder motor off, and the part fan at full speed
  # for 100 seconds to cool the print.
  {% if 'gcode_macro END_PRINT' in printer %}
    END_PRINT
  {% endif %}
  RESPOND MSG="✅ Print end macro complete"
