# FLSUN_Macros: PID tuning for the hotend (270 C) and the bed (100 C), each
# saved with SAVE_CONFIG (which restarts Klipper).

[gcode_macro PID_EXTRUDER]
gcode:
  RESPOND MSG="⚙️ PID tuning: Extruder to 270°C"
  relay_on
  PID_CALIBRATE HEATER=extruder TARGET=270
  relay_off
  SAVE_CONFIG
  RESPOND MSG="✅ Extruder PID tuning complete"

[gcode_macro PID_BED]
gcode:
  RESPOND MSG="⚙️ PID tuning: Bed to 100°C"
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  SAVE_CONFIG
  RESPOND MSG="✅ Bed PID tuning complete"
