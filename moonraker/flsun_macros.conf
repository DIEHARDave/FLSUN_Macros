# FLSUN_Macros - keeps the macros up to date through Mainsail's and Fluidd's
# update manager. install.sh links this file into the config folder and
# includes it from moonraker.conf; don't edit it.

[update_manager flsun_macros]
type: git_repo
channel: dev
primary_branch: main
path: ~/FLSUN_Macros
origin: https://github.com/DIEHARDave/FLSUN_Macros.git
managed_services: klipper
